      tags: [Đặt giá]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        description: Số tiền max bid người dùng muốn đặt.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidRequest'
            example:
              amount: 1500000
      responses:
        '200':
          description: Đặt giá thành công, trả về bid hiển thị sau khi áp dụng proxy logic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
