        Với `AUCTION_SALE`, cần truyền `addressId` để snapshot địa chỉ trước khi thanh toán; `LISTING_FEE` không cần snapshot giao hàng nhưng controller hiện nhận cả `invoiceId` và `addressId`.
      operationId: createVnPayPayment
      tags: [Thanh toán]
      security:
        - BearerAuth: []
      parameters:
        - name: invoiceId
          in: query
          required: true
