          application/json:
            schema:
              $ref: '#/components/schemas/AuctionSessionRequest'
            example:
              productId: 10
              startTime: "2026-06-01T09:00:00"
              endTime: "2026-06-01T12:00:00"
              reservePrice: 3000000
              buyNowPrice: 5000000
      responses:
        '200':
          description: Tạo phiên đấu giá thành công; có thể kèm URL thanh toán phí niêm yết.
