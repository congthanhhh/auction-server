openapi: 3.0.0
info:
  title: API hệ thống đấu giá trực tuyến
  description: |
    Tài liệu API cho backend đấu giá trực tuyến `auction-server`.
    Hệ thống hỗ trợ đăng ký, xác thực JWT, quản lý sản phẩm, tạo phiên đấu giá, đặt giá proxy/max-bid, lập hóa đơn, thanh toán VNPay, vận chuyển, khiếu nại và đánh giá uy tín.
    Sản phẩm phải được duyệt trước khi tạo phiên đấu giá; mỗi sản phẩm chỉ có một phiên đấu giá.
    Phiên đấu giá có giá sàn cần thanh toán hóa đơn `LISTING_FEE` trước khi được lên lịch, còn hóa đơn `AUCTION_SALE` cần snapshot địa chỉ trước khi thanh toán.
  version: 0.0.1-SNAPSHOT
  contact:
    name: Auction Server Team

servers:
  - url: https://mnisthanh.page/auction/api/v1
    description: Production server
  - url: http://localhost:8080/api/v1
    description: Dev server

tags:
  - name: Xác thực
    description: Đăng nhập, refresh token, OTP, Google OAuth và đăng xuất.
  - name: Người dùng
    description: Quản lý tài khoản, hồ sơ cá nhân, mật khẩu và thao tác admin với người dùng.
  - name: Sản phẩm
    description: Quản lý sản phẩm, tìm kiếm, duyệt sản phẩm và trạng thái sản phẩm.
  - name: Phiên đấu giá
    description: Tạo, cập nhật, hủy, kích hoạt lại và tra cứu phiên đấu giá.
  - name: Đặt giá
    description: Đặt giá max/proxy bid và xem lịch sử bid.
  - name: Hóa đơn
    description: Hóa đơn mua hàng, phí niêm yết, giao hàng, xác nhận, khiếu nại và dashboard người bán.
  - name: Thanh toán
    description: Tạo URL thanh toán VNPay và xử lý callback.
  - name: Địa chỉ
    description: Quản lý địa chỉ giao hàng của người dùng.
  - name: Feedback
    description: Đánh giá giao dịch và hồ sơ uy tín công khai.
  - name: Thông báo
    description: Danh sách thông báo, đánh dấu đã đọc và số thông báo chưa đọc.
  - name: Danh mục
    description: Quản lý danh mục sản phẩm.
  - name: Phân quyền
    description: Quản lý role và permission.
  - name: Admin
    description: Thống kê, cấu hình hệ thống, nhật ký audit và tra cứu nghiệp vụ cho admin.
  - name: Hình ảnh
    description: Upload và xóa hình ảnh qua Cloudinary.

paths:
  /auth/authenticate:
    post:
      summary: Đăng nhập bằng tài khoản nội bộ
      description: |
        Xác thực bằng `username` hoặc `email` và `password`.
        Khi thành công, response trả về `accessToken`; `refreshToken` được đặt vào cookie HTTP-only `refresh_token` và không trả trực tiếp trong body.
      operationId: authenticate
      tags: [Xác thực]
      requestBody:
        required: true
        description: Thông tin đăng nhập của người dùng.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
            example:
              username: seller01
              password: "P@ssw0rd123"
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/introspect:
    post:
      summary: Kiểm tra hiệu lực token
      description: Kiểm tra một JWT còn hợp lệ hay không. Endpoint này được public để client có thể tự kiểm tra trạng thái token.
      operationId: introspectToken
      tags: [Xác thực]
      requestBody:
        required: true
        description: Token cần kiểm tra.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectRequest'
            example:
              token: eyJhbGciOiJIUzI1NiJ9...
      responses:
        '200':
          description: Trả về trạng thái hợp lệ của token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh-token:
    post:
      summary: Làm mới access token
      description: |
        Đọc cookie HTTP-only `refresh_token`, kiểm tra refresh token còn hiệu lực và xoay vòng refresh token mới.
        Nếu thiếu cookie, server trả lỗi `401`.
      operationId: refreshToken
      tags: [Xác thực]
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: Làm mới token thành công; cookie `refresh_token` mới được set lại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/outbound/authenticate:
    post:
      summary: Đăng nhập bằng Google authorization code
      description: |
        Nhận `code` từ Google OAuth redirect, đổi token qua OpenFeign client và tạo tài khoản hoặc phiên đăng nhập tương ứng.
        Luồng này là custom OAuth, không dùng Spring-managed `oauth2Login()`.
      operationId: outboundAuthenticate
      tags: [Xác thực]
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code do Google trả về sau khi người dùng đồng ý đăng nhập.
          schema:
            type: string
          example: 4/0AfJohXn...
      responses:
        '200':
          description: Đăng nhập Google thành công, trả về JWT access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/verify-otp:
    post:
      summary: Xác minh OTP tài khoản
      description: Xác minh OTP được gửi qua email để kích hoạt hoặc xác nhận tài khoản.
      operationId: verifyOtp
      tags: [Xác thực]
      requestBody:
        required: true
        description: Email và mã OTP cần xác minh.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerificationRequest'
            example:
              email: user@example.com
              otp: "123456"
      responses:
        '200':
          description: OTP hợp lệ và tài khoản được xác minh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      summary: Đăng xuất
      description: |
        Nếu có `Authorization: Bearer <token>` và cookie `refresh_token`, server thu hồi token tương ứng.
        Cookie `refresh_token` luôn được xóa khỏi trình duyệt.
      operationId: logout
      tags: [Xác thực]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: Đăng xuất thành công và cookie refresh token đã được xóa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users:
    post:
      summary: Đăng ký người dùng
      description: Tạo tài khoản người dùng mới. `username` không được chứa dấu hoặc khoảng trắng; tài khoản thường cần xác minh OTP trước khi hoạt động đầy đủ.
      operationId: createUser
      tags: [Người dùng]
      requestBody:
        required: true
        description: Thông tin tài khoản cần đăng ký.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreationRequest'
            example:
              username: buyer01
              password: "P@ssw0rd123"
              firstName: An
              lastName: Nguyen
              email: buyer01@example.com
              phoneNumber: "0901234567"
      responses:
        '200':
          description: Tạo người dùng thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Lấy danh sách người dùng
      description: Lấy danh sách người dùng có phân trang. Thao tác này dành cho người dùng đã xác thực hoặc admin tùy cấu hình quyền của hệ thống.
      operationId: getUsers
      tags: [Người dùng]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Danh sách người dùng được phân trang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/otp:
    post:
      summary: Tạo tài khoản và gửi OTP
      description: Tạo yêu cầu đăng ký, gửi OTP đến email để xác minh tài khoản.
      operationId: createUserOtp
      tags: [Người dùng]
      requestBody:
        required: true
        description: Thông tin tài khoản dùng để tạo OTP.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreationRequest'
      responses:
        '200':
          description: OTP đã được gửi đến email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/create-password:
    post:
      summary: Tạo mật khẩu cho tài khoản OAuth
      description: Tạo mật khẩu nội bộ cho tài khoản chưa có mật khẩu, thường dùng sau khi đăng nhập Google.
      operationId: createPassword
      tags: [Người dùng]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Mật khẩu mới cần tạo.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordCreationRequest'
            example:
              password: "P@ssw0rd123"
      responses:
        '200':
          description: Tạo mật khẩu thành công, response body rỗng.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/update-my-info:
    put:
      summary: Cập nhật thông tin cá nhân
      description: Cập nhật họ tên, email và số điện thoại của người dùng hiện tại.
      operationId: updateMyInfo
      tags: [Người dùng]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Thông tin cá nhân cần cập nhật.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Cập nhật thông tin cá nhân thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    get:
      summary: Lấy chi tiết người dùng theo id
      description: Trả về thông tin người dùng theo `id`. Endpoint yêu cầu JWT.
      operationId: getUserById
      tags: [Người dùng]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Thông tin người dùng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/my-info:
    get:
      summary: Lấy thông tin người dùng hiện tại
      description: Trả về thông tin tài khoản đang đăng nhập dựa trên JWT.
      operationId: getMyInfo
      tags: [Người dùng]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thông tin người dùng hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/delete/{id}:
    delete:
      summary: Xóa người dùng
      description: Xóa người dùng theo `id`. Response trả về chuỗi thông báo thành công.
      operationId: deleteUser
      tags: [Người dùng]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Xóa người dùng thành công.
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/change-password:
    post:
      summary: Đổi mật khẩu
      description: Đổi mật khẩu cho người dùng hiện tại. `currentPassword` phải khớp mật khẩu đang dùng.
      operationId: changePassword
      tags: [Người dùng]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: Mật khẩu hiện tại và mật khẩu mới.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassRequest'
      responses:
        '200':
          description: Đổi mật khẩu thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/forgot-password:
    post:
      summary: Yêu cầu quên mật khẩu
      description: Gửi OTP đặt lại mật khẩu đến email đã đăng ký.
      operationId: forgotPassword
      tags: [Người dùng]
      requestBody:
        required: true
        description: Email cần gửi OTP đặt lại mật khẩu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassRequest'
      responses:
        '200':
          description: OTP đặt lại mật khẩu đã được gửi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/reset-password:
    post:
      summary: Đặt lại mật khẩu
      description: Đặt lại mật khẩu bằng email, OTP hợp lệ và mật khẩu mới.
      operationId: resetPassword
      tags: [Người dùng]
      requestBody:
        required: true
        description: Thông tin đặt lại mật khẩu.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassRequest'
      responses:
        '200':
          description: Đặt lại mật khẩu thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/my-profile:
    get:
      summary: Lấy hồ sơ cá nhân mở rộng
      description: Trả về hồ sơ cá nhân của người dùng hiện tại, gồm trạng thái mật khẩu, role, điểm uy tín và số strike.
      operationId: getMyProfile
      tags: [Người dùng]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Hồ sơ cá nhân của người dùng hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}/public-profile:
    get:
      summary: Lấy hồ sơ công khai người dùng
      description: Trả về hồ sơ công khai, dùng cho trang người bán hoặc người tham gia đấu giá. Không trả email hoặc số điện thoại.
      operationId: getPublicUserProfile
      tags: [Người dùng]
      parameters:
        - $ref: '#/components/parameters/UserIdNamed'
      responses:
        '200':
          description: Hồ sơ công khai của người dùng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/admin/search:
    get:
      summary: Admin tìm kiếm người dùng
      description: Lọc người dùng theo trạng thái hoạt động, role và kiểu sắp xếp. Dùng cho màn hình quản trị tài khoản.
      operationId: searchUsersForAdmin
