      description: |
        Đặt max/proxy bid cho phiên đang `ACTIVE`.
        Service dùng pessimistic locking, cooldown 10 giây, bước giá theo cấu hình `BID_INCREMENT_STEPS` và logic proxy/max-bid. Người bán không được bid sản phẩm của mình; bid đầu tiên sẽ vô hiệu hóa buy-now.
