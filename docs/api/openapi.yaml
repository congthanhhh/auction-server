components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Xác thực bằng JWT (JSON Web Token). Sau khi đăng nhập thành công,
        server trả về token. Token này phải được gửi kèm trong header
        `Authorization` với định dạng: `Bearer <token>`

  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: false
      description: JWT access token theo định dạng `Bearer <token>`.
      schema:
        type: string
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: false
      description: Refresh token được lưu trong HTTP-only cookie.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Trang cần lấy, bắt đầu từ 1.
      schema:
        type: integer
        default: 1
        minimum: 1
      example: 1
    Size:
      name: size
      in: query
      required: false
      description: Số phần tử mỗi trang.
      schema:
        type: integer
        default: 10
        minimum: 1
      example: 10
    Sort:
      name: sort
      in: query
      required: false
      description: Kiểu sắp xếp, ví dụ `newest`, `oldest`, `price_asc`, `price_desc`.
      schema:
        type: string
    LongId:
      name: id
      in: path
      required: true
      description: ID tài nguyên.
      schema:
        type: integer
        format: int64
    UserId:
      name: id
      in: path
      required: true
      description: ID người dùng.
      schema:
        type: string
    UserIdNamed:
      name: userId
      in: path
      required: true
      description: ID người dùng.
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      description: ID phiên đấu giá.
      schema:
        type: integer
        format: int64
    ProductKeyword:
      name: keyword
      in: query
      required: false
      description: Từ khóa tìm theo tên hoặc mô tả sản phẩm.
      schema:
        type: string
    CategoryIdQuery:
      name: categoryId
      in: query
      required: false
      description: ID danh mục cần lọc.
      schema:
        type: integer
        format: int64
    MinPrice:
      name: minPrice
      in: query
      required: false
      description: Giá tối thiểu.
      schema:
        type: number
        format: double
    MaxPrice:
      name: maxPrice
      in: query
      required: false
      description: Giá tối đa.
      schema:
        type: number
        format: double

  responses:
    BadRequest:
      description: Lỗi validation hoặc request không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            message: Giá khởi điểm phải lớn hơn 0
            timestamp: "2026-05-15T10:30:00"
    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            message: Chưa xác thực hoặc token không hợp lệ.
            timestamp: "2026-05-15T10:30:00"
    Forbidden:
      description: Không có quyền thực hiện thao tác này.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            message: Bạn không có quyền truy cập tài nguyên này.
            timestamp: "2026-05-15T10:30:00"
    NotFound:
      description: Không tìm thấy tài nguyên yêu cầu.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            message: Không tìm thấy tài nguyên.
            timestamp: "2026-05-15T10:30:00"
    InternalServerError:
      description: Lỗi máy chủ hoặc lỗi nghiệp vụ chưa được ánh xạ cụ thể.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            message: Lỗi máy chủ.
            timestamp: "2026-05-15T10:30:00"
            exception: RuntimeException

  schemas:
    AuctionStatus:
      type: string
      description: Trạng thái vòng đời của phiên đấu giá.
      enum: [SCHEDULED, ACTIVE, ENDED, CANCELLED, FAILED, WAITING_PAYMENT]
      example: ACTIVE
    ProductStatus:
      type: string
      description: Trạng thái duyệt của sản phẩm.
      enum: [WAITING_FOR_APPROVAL, ACTIVE, REJECTED, BANNED]
      example: WAITING_FOR_APPROVAL
    InvoiceStatus:
      type: string
      description: Trạng thái hóa đơn.
      enum: [PENDING, PAID, SHIPPING, COMPLETED, DISPUTE, CANCELLED_NON_PAYMENT, CANCELLED_BY_SELLER, REFUNDED]
      example: PENDING
    InvoiceType:
      type: string
      description: Loại hóa đơn.
      enum: [AUCTION_SALE, LISTING_FEE]
      example: AUCTION_SALE
    FeedbackRating:
      type: string
      description: Mức đánh giá feedback, ảnh hưởng đến điểm uy tín.
