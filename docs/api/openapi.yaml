          schema:
            type: integer
            format: int64
        - name: addressId
          in: query
          required: true
          description: ID địa chỉ giao hàng dùng để snapshot cho hóa đơn mua hàng.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: URL thanh toán VNPay.
          content:
            text/plain:
              schema:
                type: string
                format: uri
              example: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?vnp_Amount=500000000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
