        Mỗi sản phẩm chỉ có một phiên đấu giá. Nếu có `reservePrice`, hệ thống tạo hóa đơn `LISTING_FEE` bằng `reservePrice * LISTING_FEE_PERCENT` và phiên ở trạng thái `WAITING_PAYMENT` cho đến khi VNPay xác nhận thanh toán.
